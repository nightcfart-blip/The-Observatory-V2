
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#01050d">
  <title>Watch Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="universe">
    <canvas id="spaceCanvas" aria-hidden="true"></canvas>

    <nav id="constellation" aria-label="Main navigation">
      <div class="constellation-title">NORMA</div>

      <svg class="constellation-lines"
           viewBox="0 0 340 220"
           preserveAspectRatio="xMidYMid meet"
           aria-hidden="true">
        <defs>
          <linearGradient id="threadLight">
            <stop offset="0" stop-color="#6d85e8"/>
            <stop offset=".5" stop-color="#d9eaff"/>
            <stop offset="1" stop-color="#85caff"/>
          </linearGradient>
        </defs>

        <g class="threads">
          <path d="M43 155 L113 57 L196 105 L291 39"/>
          <path d="M196 105 L258 178 L291 39"/>
        </g>

        <g class="light-trails">
          <path class="trail trail-one" d="M43 155 L113 57 L196 105 L291 39"/>
          <path class="trail trail-two" d="M196 105 L258 178 L291 39"/>
        </g>
      </svg>

      <button class="constellation-star star-settings"
              data-panel="settings"
              style="--x:12.65%;--y:70.45%;--size:21px;--tint:185,209,255;--duration:5.7s"
              aria-label="Settings">
        <span class="star-light"></span>
        <span class="star-core"></span>
        <span class="star-label">Settings</span>
      </button>

      <button class="constellation-star star-library"
              data-panel="library"
              style="--x:33.24%;--y:25.91%;--size:27px;--tint:216,231,255;--duration:7.3s"
              aria-label="Library">
        <span class="star-light"></span>
        <span class="star-core"></span>
        <span class="star-label">Library</span>
      </button>

      <button class="constellation-star star-creation"
              data-panel="creation"
              style="--x:57.65%;--y:47.73%;--size:33px;--tint:170,178,255;--duration:6.4s"
              aria-label="Creation">
        <span class="star-light"></span>
        <span class="star-core"></span>
        <span class="star-label">Creation</span>
      </button>

      <button class="constellation-star star-watchlist"
              data-panel="watchlist"
              style="--x:85.59%;--y:17.73%;--size:24px;--tint:181,234,255;--duration:8.1s"
              aria-label="Watchlist">
        <span class="star-light"></span>
        <span class="star-core"></span>
        <span class="star-label">Watchlist</span>
      </button>

      <button class="constellation-star star-statistics"
              data-panel="statistics"
              style="--x:75.88%;--y:80.91%;--size:25px;--tint:192,178,255;--duration:6.9s"
              aria-label="Statistics">
        <span class="star-light"></span>
        <span class="star-core"></span>
        <span class="star-label">Statistics</span>
      </button>
    </nav>

    <button id="homeBtn" class="home-button"
            type="button" aria-label="Return to starting position"
            title="Return to start">
      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 3.5 10.5V21h17V10.5L12 3Z"/>
        <path d="M9 21v-7h6v7"/>
      </svg>
    </button>

    <section id="glassPanel"
             class="glass-panel"
             aria-label="Navigation panel"
             aria-hidden="true"
             inert>
      <div class="glass-sheen"></div>

      <header class="glass-header">
        <div>
          <span class="glass-eyebrow">WATCH ARCHIVE</span>
          <h2 id="panelTitle">Settings</h2>
        </div>
        <button id="closePanel" class="glass-close"
                type="button" aria-label="Close panel">×</button>
      </header>

      <div id="panelContent" class="glass-content"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
