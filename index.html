<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <meta name="theme-color" content="#020611" />
  <meta name="color-scheme" content="dark" />
  <title>Watch Tracker — Space Scene</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="universe" aria-label="Interactive space environment">
    <canvas id="spaceCanvas" aria-hidden="true"></canvas>

    <div class="ui-dock">
      <button id="homeBtn" class="ui-btn" type="button" aria-label="Return to start">
        ⌂
      </button>
      <button id="settingsBtn" class="ui-btn" type="button" aria-label="Open settings">
        ⚙
      </button>
    </div>

    <aside id="settingsPanel" class="settings-panel hidden" aria-label="Scene settings">
      <div class="panel-header">
        <h2>Scene Settings</h2>
        <button id="closeSettingsBtn" class="close-btn" type="button" aria-label="Close settings">
          ✕
        </button>
      </div>

      <div class="panel-scroll">
        <section class="setting-group">
          <h3>Stars</h3>

          <label class="setting-row">
            <span>Amount</span>
            <input id="starsAmount" type="range" min="0.4" max="2.2" step="0.05" />
            <output id="starsAmountValue"></output>
          </label>

          <label class="setting-row">
            <span>Brightness</span>
            <input id="starsBrightness" type="range" min="0.3" max="2" step="0.05" />
            <output id="starsBrightnessValue"></output>
          </label>

          <label class="setting-row">
            <span>Color Difference</span>
            <input id="starsColorVariance" type="range" min="0" max="1.5" step="0.05" />
            <output id="starsColorVarianceValue"></output>
          </label>

          <label class="setting-row">
            <span>Ambient Twinkle</span>
            <input id="starsTwinkle" type="range" min="0" max="2" step="0.05" />
            <output id="starsTwinkleValue"></output>
          </label>
        </section>

        <section class="setting-group">
          <h3>Shooting Stars</h3>

          <label class="setting-row">
            <span>Frequency</span>
            <input id="shootingFrequency" type="range" min="0" max="2" step="0.05" />
            <output id="shootingFrequencyValue"></output>
          </label>
        </section>

        <section class="setting-group">
          <h3>Nebulae</h3>

          <label class="setting-row">
            <span>Color Difference</span>
            <input id="nebulaColorVariance" type="range" min="0.3" max="2.2" step="0.05" />
            <output id="nebulaColorVarianceValue"></output>
          </label>

          <label class="setting-row">
            <span>Brightness</span>
            <input id="nebulaBrightness" type="range" min="0.25" max="2.2" step="0.05" />
            <output id="nebulaBrightnessValue"></output>
          </label>

          <label class="setting-row">
            <span>Size</span>
            <input id="nebulaSize" type="range" min="0.45" max="2.1" step="0.05" />
            <output id="nebulaSizeValue"></output>
          </label>

          <label class="setting-row">
            <span>Frequency</span>
            <input id="nebulaFrequency" type="range" min="0.2" max="2" step="0.05" />
            <output id="nebulaFrequencyValue"></output>
          </label>
        </section>

        <section class="setting-group">
          <h3>Ambient</h3>

          <label class="setting-row">
            <span>Volume</span>
            <input id="ambientVolume" type="range" min="0" max="0.2" step="0.0025" />
            <output id="ambientVolumeValue"></output>
          </label>
        </section>
      </div>
    </aside>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
