<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <meta name="theme-color" content="#01050d" />
  <title>Watch Archive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="universe">
    <canvas id="spaceCanvas" aria-hidden="true"></canvas>

    <!-- world-anchored constellation -->
    <div id="constellationLayer" aria-label="Constellation navigation">
      <svg
        id="constellationSvg"
        class="constellation-svg"
        viewBox="0 0 100 100"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="constellationFlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="40%" stop-color="#8dc5ff" />
            <stop offset="50%" stop-color="#f4fbff" />
            <stop offset="60%" stop-color="#a087ff" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
          </linearGradient>
        </defs>

        <path id="lineA-base" class="constellation-line-base" d="" />
        <path id="lineB-base" class="constellation-line-base" d="" />

        <path id="lineA-glow" class="constellation-line-glow line-a" d="" />
        <path id="lineB-glow" class="constellation-line-glow line-b" d="" />
      </svg>

      <button class="nav-star" data-panel="settings" aria-label="Settings">
        <span class="star-halo"></span>
        <span class="star-spike star-spike-x"></span>
        <span class="star-spike star-spike-y"></span>
        <span class="star-core"></span>
        <span class="star-label">Settings</span>
      </button>

      <button class="nav-star" data-panel="library" aria-label="Library">
        <span class="star-halo"></span>
        <span class="star-spike star-spike-x"></span>
        <span class="star-spike star-spike-y"></span>
        <span class="star-core"></span>
        <span class="star-label">Library</span>
      </button>

      <button class="nav-star" data-panel="creation" aria-label="Creation">
        <span class="star-halo"></span>
        <span class="star-spike star-spike-x"></span>
        <span class="star-spike star-spike-y"></span>
        <span class="star-core"></span>
        <span class="star-label">Creation</span>
      </button>

      <button class="nav-star" data-panel="watchlist" aria-label="Watchlist">
        <span class="star-halo"></span>
        <span class="star-spike star-spike-x"></span>
        <span class="star-spike star-spike-y"></span>
        <span class="star-core"></span>
        <span class="star-label">Watchlist</span>
      </button>

      <button class="nav-star" data-panel="statistics" aria-label="Statistics">
        <span class="star-halo"></span>
        <span class="star-spike star-spike-x"></span>
        <span class="star-spike star-spike-y"></span>
        <span class="star-core"></span>
        <span class="star-label">Statistics</span>
      </button>
    </div>

    <button
      id="homeBtn"
      class="home-button"
      type="button"
      aria-label="Return to starting position"
      title="Return to start"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 3.5 10.5V21h17V10.5L12 3Z" />
        <path d="M9 21v-7h6v7" />
      </svg>
    </button>

    <section
      id="glassPanel"
      class="glass-panel"
      aria-hidden="true"
      inert
    >
      <div class="glass-prism-layer prism-a"></div>
      <div class="glass-prism-layer prism-b"></div>
      <div class="glass-prism-layer prism-c"></div>
      <div class="glass-inner-refraction"></div>

      <header class="glass-header">
        <div class="glass-title-wrap">
          <span class="glass-eyebrow">WATCH ARCHIVE</span>
          <h2 id="panelTitle">Settings</h2>
        </div>

        <button id="closePanel" class="glass-close" type="button" aria-label="Close panel">
          ×
        </button>
      </header>

      <div id="panelContent" class="glass-content"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
