<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Watch Archive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="spaceCanvas"></canvas>

  <div id="worldUI">
    <div id="archiveSky" class="archive-sky">
      <svg id="archiveLines" class="archive-lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div id="archiveStars" class="archive-stars"></div>
    </div>

    <div id="constellationLayer" class="constellation-layer">
      <svg id="constellationSvg" class="constellation-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="lineA-base" class="constellation-line base" d="" />
        <path id="lineB-base" class="constellation-line base" d="" />
        <path id="lineA-glow" class="constellation-line glow" d="" />
        <path id="lineB-glow" class="constellation-line glow" d="" />
      </svg>

      <button class="nav-star" data-panel="settings" aria-label="Settings">
        <span class="nav-core"></span>
        <span class="nav-label">Settings</span>
      </button>

      <button class="nav-star" data-panel="library" aria-label="Library">
        <span class="nav-core"></span>
        <span class="nav-label">Library</span>
      </button>

      <button class="nav-star" data-panel="creation" aria-label="Creation">
        <span class="nav-core"></span>
        <span class="nav-label">Creation</span>
      </button>

      <button class="nav-star" data-panel="watchlist" aria-label="Watchlist">
        <span class="nav-core"></span>
        <span class="nav-label">Watchlist</span>
      </button>

      <button class="nav-star" data-panel="statistics" aria-label="Statistics">
        <span class="nav-core"></span>
        <span class="nav-label">Statistics</span>
      </button>
    </div>

    <button id="homeBtn" class="home-btn" type="button" aria-label="Return to start">
      ⌂
    </button>

    <aside id="glassPanel" class="glass-panel" aria-hidden="true" inert>
      <div class="glass-shell">
        <div class="glass-head">
          <div class="glass-head-copy">
            <div id="panelEyebrow" class="panel-eyebrow">WATCH ARCHIVE</div>
            <h2 id="panelTitle" class="panel-title">Panel</h2>
          </div>
          <button id="closePanel" class="close-btn" type="button" aria-label="Close panel">×</button>
        </div>

        <div id="panelToolbar" class="panel-toolbar" hidden></div>
        <div id="panelContent" class="panel-content"></div>
        <div id="panelFooter" class="panel-footer" hidden></div>
      </div>
    </aside>

    <div id="toast" class="toast"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
